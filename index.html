<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name Portfolio</title>
    <style>
        /* 全体のリセットと基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            color: #333;
            background-color: #fcfcfc;
            line-height: 1.6;
        }
        a {
            color: #333;
            text-decoration: none;
        }

        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 10%;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 24px;
            letter-spacing: 2px;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a:hover {
            color: #888;
        }

        /* メインビジュアル */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .hero p {
            color: #666;
        }

        /* コンテンツ共通レイアウト */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 50px;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background-color: #333;
            margin: 10px auto 0;
        }

        /* 作品ギャラリー（グリッド表示） */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .work-item {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .work-item:hover {
            transform: translateY(-5px);
        }
        .work-info {
            padding: 20px;
        }
        .work-info h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .work-info p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
        <nav>
            <ul>
                <li><a href="#works">Works</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to My Creative Space</h2>
        <p>ポートフォリオを公開します</p>
    </section>

    <section id="works" class="container">
        <h2 class="section-title">Works</h2>
        <div class="gallery">
            
            <div class="work-item">
                <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%;">
                    <iframe src="https://www.youtube.com/embed/uszHWi5tmb0" 
                            title="YouTube video player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin" 
                            allowfullscreen
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                    </iframe>
                </div>
                <div class="work-info">
                    <h3>動画作品タイトル</h3>
                    <p>YouTubeにアップロードした動画作品の解説や、制作に使用したソフト（After Effects, Premiere Proなど）、担当した役割（編集、アニメーションなど）をここに記載します。</p>
                </div>
            </div>
            
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Your Name. All Rights Reserved.</p>
    </footer>

</body>
</html>
